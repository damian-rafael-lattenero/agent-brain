org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Corretto only (house rule): never let Gradle download some other vendor.
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
# GitHub runners expose JDKs as JAVA_HOME_<major>_X64: the daemon may run on 21 while the toolchain is 25.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_21_X64

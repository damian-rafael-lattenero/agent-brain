org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Corretto only (house rule): never let Gradle download some other vendor.
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
# GitHub runners expose JDKs as JAVA_HOME_<major>_X64. Single-JVM build since
# the detekt 2.0 upgrade: daemon and toolchain are the same Corretto 25, the
# probe is belt and braces.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

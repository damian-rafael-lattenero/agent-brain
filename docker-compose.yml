services:
  pg:
    image: pgvector/pgvector:pg18
    container_name: agent-brain-pg
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: agent_brain
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d agent_brain"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      pg:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: agent_brain
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brain -d agent_brain"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      AB_PG_URL: jdbc:postgresql://127.0.0.1:5433/agent_brain
      AB_PG_USER: brain
      AB_PG_PASSWORD: brain
      AB_OLLAMA_BASE_URL: http://127.0.0.1:11434
      # Services are present here, so an unreachable one is a failure, never a skip.
      AB_REQUIRE_SERVICES: "1"
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      # The bot repo provides the REAL bus publisher for the P1 black-box scenario
      # (the test skips with a visible reason until bus.py is on its master).
      AB_BOT_REPO: ${{ github.workspace }}/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: damian-rafael-lattenero/zcode-bot
          path: bot

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # KAP 4.1.0 (with the fixes this project reported) is consumed from mavenLocal until the
      # Central release is tagged: build it from the library repo. Drop this step afterwards.
      - uses: actions/checkout@v4
        with:
          repository: damian-rafael-lattenero/kap
          path: kap
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - name: KAP 4.1.0 to mavenLocal (daemon on 21, toolchain 25 detected)
        run: cd kap && ./gradlew publishToMavenLocal -PskipSigning -x test -x jvmTest

      - name: Ollama (the default embedding provider, exercised for real)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 1; done
          ollama pull nomic-embed-text
          ollama pull qwen2.5:1.5b

      - name: Redpanda (the Kafka transport, exercised for real)
        run: |
          docker run -d --name redpanda -p 127.0.0.1:19092:19092 redpandadata/redpanda:v26.2.6 \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092 \
            --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:19092
          for i in $(seq 1 40); do docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && break; sleep 2; done
          docker exec redpanda rpk cluster health

      - name: "Gate: the tree compiles with warnings as errors"
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin

      - name: "Tiers 1-3: unit, integration, e2e"
        run: ./gradlew --no-daemon test

      - name: "Tier 4: black-box local (installed distribution, real services)"
        run: ./gradlew --no-daemon bbLocal

      - name: "Eval gate: 20 recall questions, real model, gate 0.9"
        run: ./gradlew --no-daemon :core:installDist && core/build/install/agent-brain/bin/agent-brain eval

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore
